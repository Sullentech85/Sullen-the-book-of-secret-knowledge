name: Link Check

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 8
            --timeout 15
            --retry-wait-time 2
            --user-agent "Mozilla/5.0 (compatible; SullenLinkCheck/1.0)"
            --accept 200,204,301,302,403
            --exclude-all-private
            README.md
          token: ${{ secrets.GITHUB_TOKEN }}
          # Don't fail here, so the issue step below still runs; the last step fails the job.
          fail: false

      - name: Create Issue From File
        # Only on scheduled or manual runs, so pushes and PRs don't open duplicate issues.
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'push' && github.event_name != 'pull_request'
        # Issues are currently disabled on this fork; don't let that mask the link result.
        continue-on-error: true
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "Broken links detected in Book of Secret Knowledge"
          content-filepath: ./lychee/out.md
          labels: |
            documentation
            automated
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if broken links were found
        if: steps.lychee.outputs.exit_code != 0
        env:
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          echo "lychee exited with code ${LYCHEE_EXIT_CODE}; see the job summary for broken links."
          exit 1
